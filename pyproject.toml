[build-system]
requires = ["setuptools>=75,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "pytincture"

version = "1.0.0rc2"

description = "UI Builder"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
authors = [
    { name = "Pytincture maintainers", email = "schapman1974@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115,<1",
    "itsdangerous>=2.2,<3",
    "markupsafe>=3,<4",
    "packaging>=24,<27",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "starlette>=1.6,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
oauth = [
    "authlib>=1.4,<2",
    "httpx>=0.27,<1",
]
password = [
    "argon2-cffi>=23.1,<26",
    "bcrypt>=4.2,<6",
]
redis = [
    "upstash-redis>=1.2,<2",
]
saml = [
    "python3-saml>=1.16,<2",
    "xmlsec>=1.3.17,<2",
]
mcp = [
    "fastmcp>=3.4.7,<4",
]
dev = [
    "argon2-cffi>=23.1,<26",
    "authlib>=1.4,<2",
    "bcrypt>=4.2,<6",
    "build>=1.2,<2",
    "fastmcp>=3.4.7,<4",
    "httpx>=0.27,<1",
    "httpx2>=2,<3",
    "pytest>=8.3,<10",
    "python3-saml>=1.16,<2",
    "twine>=6,<7",
    "upstash-redis>=1.2,<2",
    "xmlsec>=1.3.17,<2",
]

[project.urls]
Homepage = "https://github.com/pytincture/pytincture"
Changelog = "https://github.com/pytincture/pytincture/blob/main/CHANGELOG.md"
Documentation = "https://github.com/pytincture/pytincture/tree/main/docs"
Issues = "https://github.com/pytincture/pytincture/issues"
Source = "https://github.com/pytincture/pytincture"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages]
find = { include = ["pytincture*"] }

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
pytincture = [
    "frontend/index.html",
    "frontend/pytincture.js",
    "frontend/sw.js",
    "frontend/bff-docs.js",
    "frontend/dist/*",
    "frontend/vendor/swagger-ui/*",
    "frontend/pyodide/**/*",
]
