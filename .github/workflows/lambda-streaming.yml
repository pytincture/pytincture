name: Lambda streaming recipe

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lambda-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.8.0'
      - name: Install framework and optional deployment tooling
        run: |
          uv sync --frozen --extra dev
          uv pip install --python .venv/bin/python \
            boto3==1.43.111 'botocore[crt]==1.43.111' \
            cfn-lint==1.46.0 guardpycfn==0.1.0
      - name: Check CloudFormation schema and private streaming rules
        run: .venv/bin/python scripts/validate_lambda_template.py
      - name: Check forwarding and bounded model invocation contracts
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_lambda_forward.py tests/test_lambda_template.py examples/bedrock-streaming
