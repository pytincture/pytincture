name: Publish Python artifacts

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published v-prefixed release tag to retry
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-python-release:
    name: Verify attested Python release artifacts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      already_published: ${{ steps.registry.outputs.already_published }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}
      tag_sha: ${{ steps.source.outputs.tag_sha }}

    steps:
      - name: Check out trusted publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve protected published release and successful release run
        id: source
        env:
          AUTO_RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          AUTO_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$DISPATCH_RELEASE_TAG"
          else
            release_tag="$AUTO_RELEASE_TAG"
          fi
          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?(\.dev(0|[1-9][0-9]*))?$ ]]; then
            echo "Unsupported release tag" >&2
            exit 1
          fi

          release_json="$RUNNER_TEMP/pytincture-release.json"
          run_json="$RUNNER_TEMP/pytincture-release-run.json"
          gh api "repos/$REPOSITORY/releases/tags/$release_tag" > "$release_json"
          tag_sha=$(gh api "repos/$REPOSITORY/commits/$release_tag" --jq .sha)
          default_branch=$(gh api "repos/$REPOSITORY" --jq .default_branch)
          merge_base=$(gh api \
            "repos/$REPOSITORY/compare/$tag_sha...$default_branch" \
            --jq .merge_base_commit.sha)
          if [[ "$merge_base" != "$tag_sha" ]]; then
            echo "Release tag commit is not reachable from the protected default branch" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            runs_json="$RUNNER_TEMP/pytincture-release-runs.json"
            gh api --method GET \
              "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
              -f event=release \
              -f status=success \
              -f per_page=100 > "$runs_json"
            source_run_id=$(jq -r \
              --arg tag "$release_tag" \
              --arg sha "$tag_sha" \
              '[.workflow_runs[] | select(
                .event == "release" and
                .conclusion == "success" and
                .head_branch == $tag and
                .head_sha == $sha and
                .path == ".github/workflows/ci.yml"
              )] | sort_by(.created_at) | last | .id // empty' \
              "$runs_json")
          else
            source_run_id="$AUTO_SOURCE_RUN_ID"
          fi
          if [[ ! "$source_run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "No successful release CI run found for tag" >&2
            exit 1
          fi

          gh api "repos/$REPOSITORY/actions/runs/$source_run_id" > "$run_json"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "release_json=$release_json" >> "$GITHUB_OUTPUT"
          echo "run_json=$run_json" >> "$GITHUB_OUTPUT"

      - name: Download exact retained release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
          run-id: ${{ steps.source.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Verify release metadata, package identity, and retained hashes
        id: verify
        env:
          RELEASE_JSON: ${{ steps.source.outputs.release_json }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          RUN_JSON: ${{ steps.source.outputs.run_json }}
          TAG_SHA: ${{ steps.source.outputs.tag_sha }}
        shell: bash
        run: |
          set -euo pipefail
          verification=$(python scripts/verify_python_release.py \
            --repository "$REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --tag-sha "$TAG_SHA" \
            --release-json "$RELEASE_JSON" \
            --run-json "$RUN_JSON" \
            --artifact-dir dist)
          echo "python_version=$(jq -r .python_version <<< "$verification")" >> "$GITHUB_OUTPUT"
          echo "wheel_path=$(jq -r .wheel_path <<< "$verification")" >> "$GITHUB_OUTPUT"
          echo "sdist_path=$(jq -r .sdist_path <<< "$verification")" >> "$GITHUB_OUTPUT"

      - name: Verify artifact attestations and trusted builder identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SDIST_PATH: ${{ steps.verify.outputs.sdist_path }}
          TAG_SHA: ${{ steps.source.outputs.tag_sha }}
          WHEEL_PATH: ${{ steps.verify.outputs.wheel_path }}
        shell: bash
        run: |
          set -euo pipefail
          for artifact in "$WHEEL_PATH" "$SDIST_PATH"; do
            gh attestation verify "$artifact" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/ci.yml" \
              --source-digest "$TAG_SHA" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners
          done

      - name: Check whether the immutable Python version already exists
        id: registry
        env:
          PYTHON_VERSION: ${{ steps.verify.outputs.python_version }}
        shell: bash
        run: |
          set -euo pipefail
          if curl --fail --silent --show-error \
            "https://pypi.org/pypi/pytincture/$PYTHON_VERSION/json" >/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "pytincture==$PYTHON_VERSION is already published; retry is a no-op."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

  publish-python:
    name: Publish attested Python release artifacts with OIDC
    needs: verify-python-release
    if: needs.verify-python-release.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write

    steps:
      - name: Download exact retained Python artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-artifacts
          path: python-dist
          run-id: ${{ needs.verify-python-release.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reverify artifact attestations inside the protected publishing job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify-python-release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TAG_SHA: ${{ needs.verify-python-release.outputs.tag_sha }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_count=0
          for artifact in python-dist/*.whl python-dist/*.tar.gz; do
            [[ -f "$artifact" && ! -L "$artifact" ]] || exit 1
            artifact_count=$((artifact_count + 1))
            gh attestation verify "$artifact" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/ci.yml" \
              --source-digest "$TAG_SHA" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners
          done
          [[ "$artifact_count" -eq 2 ]]

      - name: Publish exact artifacts through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python-dist
          attestations: true
          print-hash: true
