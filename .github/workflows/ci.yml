name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .

      - name: Run tests
        run: python -m pytest -q

  python-package:
    name: Validate Python package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke-test wheel installation
        shell: bash
        run: |
          python -m venv /tmp/pytincture-wheel-smoke
          /tmp/pytincture-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/pytincture-wheel-smoke/bin/python -c "import pytincture; print(pytincture.__version__)"

  javascript-runtime:
    name: Validate JavaScript runtime
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pytincture/frontend/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: pytincture/frontend
        run: npm ci

      - name: Run JavaScript unit tests
        working-directory: pytincture/frontend
        run: npm test

      - name: Install Chromium
        working-directory: pytincture/frontend
        run: npx playwright install --with-deps chromium

      - name: Run lifecycle browser tests
        working-directory: pytincture/frontend
        run: npm run test:browser

      - name: Build runtime bundles
        working-directory: pytincture/frontend
        run: npm run build

      - name: Verify generated bundles are current
        run: git diff --exit-code -- pytincture/frontend/package.json pytincture/frontend/dist

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-lifecycle-report
          path: |
            pytincture/frontend/playwright-report
            pytincture/frontend/test-results
          if-no-files-found: ignore

  browser-e2e:
    name: Pyodide E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Pytincture and prepare the pinned widget wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip download --no-deps --dest tests/e2e_apps dhxpyt==0.9.16
          cp tests/e2e_apps/dhxpyt-0.9.16-py3-none-any.whl tests/e2e_apps/dhxpyt-0.9.16+backend-py3-none-any.whl

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pytincture/frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: pytincture/frontend
        run: npm ci

      - name: Install ${{ matrix.browser }}
        working-directory: pytincture/frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run real Pyodide tests in ${{ matrix.browser }}
        working-directory: pytincture/frontend
        env:
          PYTINCTURE_E2E_PYTHON: python
        run: npx playwright test --config playwright.e2e.config.mjs --project ${{ matrix.browser }}

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytincture-e2e-${{ matrix.browser }}
          path: |
            pytincture/frontend/playwright-report
            pytincture/frontend/test-results
            tests/e2e-server.log
          if-no-files-found: ignore

  production-smoke:
    name: Production topology smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build and install Pytincture wheel in a clean environment
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir .production-wheel .
          python -m pip install .production-wheel/pytincture-*.whl

      - name: Run health load budget
        env:
          MODULES_PATH: tests/e2e_apps
          PYTINCTURE_DEFAULT_APPLICATION: e2e_app
        run: |
          python -m uvicorn pytincture.backend.app:app --host 127.0.0.1 --port 8081 > production-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python scripts/load_smoke.py \
            --base-url http://127.0.0.1:8081 \
            --requests 500 \
            --concurrency 20 \
            --p95-budget-ms 500

      - name: Upload production smoke log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-log
          path: production-smoke.log
          if-no-files-found: ignore
