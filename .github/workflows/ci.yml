name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[dev]'

      - name: Run tests
        run: python -m pytest -q

  python-package:
    name: Validate release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pytincture/frontend/package-lock.json

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build npm runtime package
        working-directory: pytincture/frontend
        run: |
          npm ci
          npm run build
          mkdir -p ../../dist
          npm pack --pack-destination ../../dist

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python scripts/normalize_sdist.py dist/*.tar.gz "$SOURCE_DATE_EPOCH"

      - name: Validate distributions
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Inspect release contents and versions
        shell: bash
        run: |
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          sdist_path=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          npm_path=$(find dist -maxdepth 1 -name '*.tgz' -print -quit)
          python scripts/inspect_release_artifacts.py \
            --wheel "$wheel_path" \
            --sdist "$sdist_path" \
            --npm "$npm_path" | tee dist/SHA256SUMS.json

      - name: Verify reproducible artifact bytes
        run: |
          mkdir -p .reproducible
          python -m build --outdir .reproducible
          python scripts/normalize_sdist.py .reproducible/*.tar.gz "$SOURCE_DATE_EPOCH"
          (
            cd pytincture/frontend
            npm pack --pack-destination "$GITHUB_WORKSPACE/.reproducible"
          )
          cmp dist/*.whl .reproducible/*.whl
          cmp dist/*.tar.gz .reproducible/*.tar.gz
          cmp dist/*.tgz .reproducible/*.tgz

      - name: Smoke-test wheel and source distribution installations
        shell: bash
        run: |
          python -m venv /tmp/pytincture-wheel-smoke
          /tmp/pytincture-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/pytincture-wheel-smoke/bin/python scripts/smoke_optional_extra.py base
          python -m venv /tmp/pytincture-sdist-smoke
          /tmp/pytincture-sdist-smoke/bin/python -m pip install dist/*.tar.gz
          /tmp/pytincture-sdist-smoke/bin/python scripts/smoke_optional_extra.py base

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  optional-extras:
    name: Clean install (${{ matrix.extra }})
    needs: python-package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra:
          - oauth
          - password
          - redis
          - saml
          - mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Download validated artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-artifacts
          path: dist

      - name: Install and smoke-test ${{ matrix.extra }} extra
        shell: bash
        env:
          PYTINCTURE_EXTRA: ${{ matrix.extra }}
        run: |
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          python -m pip install "${wheel_path}[${PYTINCTURE_EXTRA}]"
          python scripts/smoke_optional_extra.py "$PYTINCTURE_EXTRA"

  javascript-runtime:
    name: Validate JavaScript runtime
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pytincture/frontend/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: pytincture/frontend
        run: npm ci

      - name: Run JavaScript unit tests
        working-directory: pytincture/frontend
        run: npm test

      - name: Install Chromium
        working-directory: pytincture/frontend
        run: npx playwright install --with-deps chromium

      - name: Run lifecycle browser tests
        working-directory: pytincture/frontend
        run: npm run test:browser

      - name: Build runtime bundles
        working-directory: pytincture/frontend
        run: npm run build

      - name: Verify generated bundles are current
        run: git diff --exit-code -- pytincture/frontend/package.json pytincture/frontend/dist

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-lifecycle-report
          path: |
            pytincture/frontend/playwright-report
            pytincture/frontend/test-results
          if-no-files-found: ignore

  browser-e2e:
    name: Pyodide E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Pytincture and prepare the pinned widget wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[dev]'
          python -m pip download --no-deps --dest tests/e2e_apps dhxpyt==0.9.16
          cp tests/e2e_apps/dhxpyt-0.9.16-py3-none-any.whl tests/e2e_apps/dhxpyt-0.9.16+backend-py3-none-any.whl

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pytincture/frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: pytincture/frontend
        run: npm ci

      - name: Install ${{ matrix.browser }}
        working-directory: pytincture/frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run real Pyodide tests in ${{ matrix.browser }}
        working-directory: pytincture/frontend
        env:
          PYTINCTURE_E2E_PYTHON: python
        run: npx playwright test --config playwright.e2e.config.mjs --project ${{ matrix.browser }}

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytincture-e2e-${{ matrix.browser }}
          path: |
            pytincture/frontend/playwright-report
            pytincture/frontend/test-results
            tests/e2e-server.log
          if-no-files-found: ignore

  production-smoke:
    name: Production topology smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build and install Pytincture wheel in a clean environment
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir .production-wheel .
          python -m pip install .production-wheel/pytincture-*.whl

      - name: Run health load budget
        env:
          MODULES_PATH: tests/e2e_apps
          PYTINCTURE_DEFAULT_APPLICATION: e2e_app
        run: |
          python -m uvicorn pytincture.backend.app:app --host 127.0.0.1 --port 8081 > production-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python scripts/load_smoke.py \
            --base-url http://127.0.0.1:8081 \
            --requests 500 \
            --concurrency 20 \
            --p95-budget-ms 500

      - name: Upload production smoke log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-log
          path: production-smoke.log
          if-no-files-found: ignore

  publish-python:
    name: Publish validated Python artifacts
    if: github.event_name == 'release'
    needs:
      - python-tests
      - python-package
      - optional-extras
      - javascript-runtime
      - browser-e2e
      - production-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-artifacts
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Publish exact validated Python artifacts
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python -m pip install 'twine>=6,<7'
          python -m twine upload --verbose dist/*.whl dist/*.tar.gz

  publish-npm:
    name: Publish validated npm artifact
    if: github.event_name == 'release'
    needs:
      - python-tests
      - python-package
      - optional-extras
      - javascript-runtime
      - browser-e2e
      - production-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-artifacts
          path: dist

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish exact validated npm artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist/*.tgz --access public
