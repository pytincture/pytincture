name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Validate vendored Pyodide SBOM and checksums
        run: python scripts/validate_vendored_pyodide.py

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[dev]'

      - name: Run tests
        run: python -m pytest -q

  python-package:
    name: Validate release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pytincture/frontend/package-lock.json

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build npm runtime package
        working-directory: pytincture/frontend
        run: |
          npm ci
          npm run build
          mkdir -p ../../dist
          npm pack --pack-destination ../../dist

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python scripts/normalize_sdist.py dist/*.tar.gz "$SOURCE_DATE_EPOCH"

      - name: Validate distributions
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Inspect release contents and versions
        shell: bash
        run: |
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          sdist_path=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          npm_path=$(find dist -maxdepth 1 -name '*.tgz' -print -quit)
          python scripts/inspect_release_artifacts.py \
            --wheel "$wheel_path" \
            --sdist "$sdist_path" \
            --npm "$npm_path" | tee dist/SHA256SUMS.json

      - name: Verify reproducible artifact bytes
        run: |
          mkdir -p .reproducible
          python -m build --outdir .reproducible
          python scripts/normalize_sdist.py .reproducible/*.tar.gz "$SOURCE_DATE_EPOCH"
          (
            cd pytincture/frontend
            npm pack --pack-destination "$GITHUB_WORKSPACE/.reproducible"
          )
          cmp dist/*.whl .reproducible/*.whl
          cmp dist/*.tar.gz .reproducible/*.tar.gz
          cmp dist/*.tgz .reproducible/*.tgz

      - name: Smoke-test wheel and source distribution installations
        shell: bash
        run: |
          python -m venv /tmp/pytincture-wheel-smoke
          /tmp/pytincture-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/pytincture-wheel-smoke/bin/python scripts/smoke_optional_extra.py base
          python -m venv /tmp/pytincture-sdist-smoke
          /tmp/pytincture-sdist-smoke/bin/python -m pip install dist/*.tar.gz
          /tmp/pytincture-sdist-smoke/bin/python scripts/smoke_optional_extra.py base

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

      - name: Upload validated Python release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-release-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  optional-extras:
    name: Clean install (${{ matrix.extra }})
    needs: python-package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra:
          - oauth
          - password
          - redis
          - saml
          - mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Download validated artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-artifacts
          path: dist

      - name: Install and smoke-test ${{ matrix.extra }} extra
        shell: bash
        env:
          PYTINCTURE_EXTRA: ${{ matrix.extra }}
        run: |
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          python -m pip install "${wheel_path}[${PYTINCTURE_EXTRA}]"
          python scripts/smoke_optional_extra.py "$PYTINCTURE_EXTRA"

  upgrade-rollback:
    name: Upgrade and rollback from 0.10.7
    needs: python-package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Download validated candidate wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-artifacts
          path: dist

      - name: Exercise upgrade and package rollback
        shell: bash
        run: |
          python -m venv /tmp/pytincture-transition
          transition_python=/tmp/pytincture-transition/bin/python
          "$transition_python" -m pip install --upgrade pip
          "$transition_python" -m pip install 'pytincture==0.10.7' 'httpx>=0.27,<1'
          "$transition_python" scripts/upgrade_smoke.py --output upgrade-before.json
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          "$transition_python" -m pip install --force-reinstall "$wheel_path" 'httpx>=0.27,<1'
          "$transition_python" scripts/upgrade_smoke.py --output upgrade-candidate.json
          "$transition_python" -m pip install --force-reinstall 'pytincture==0.10.7' 'httpx>=0.27,<1'
          "$transition_python" scripts/upgrade_smoke.py --output upgrade-rollback.json
          python scripts/compare_upgrade_smoke.py \
            upgrade-before.json upgrade-candidate.json upgrade-rollback.json

      - name: Build upgrade and rollback qualification evidence
        if: always()
        run: |
          python scripts/build_qualification_evidence.py \
            --exercise upgrade_rollback \
            --status "${{ job.status }}" \
            --artifact-manifest dist/SHA256SUMS.json \
            --result before=upgrade-before.json \
            --result candidate=upgrade-candidate.json \
            --result rollback=upgrade-rollback.json \
            --output qualification-evidence-upgrade-rollback.json

      - name: Upload upgrade and rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upgrade-rollback-results
          path: |
            qualification-evidence-upgrade-rollback.json
            upgrade-*.json
          if-no-files-found: error

  release-gates:
    name: Release qualification gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Validate qualification record and version alignment
        run: python scripts/check_release_gates.py

      - name: Validate release tag and RC/final evidence
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_release_gates.py --release-ref "$GITHUB_REF_NAME"

      - name: Audit open release-blocking issues
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit_release_blockers.py

  security-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install all runtime extras and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[oauth,password,redis,saml,mcp]' 'pip-audit>=2.9,<3'

      - name: Audit Python dependencies
        run: python scripts/audit_python_dependencies.py

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pytincture/frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: pytincture/frontend
        run: |
          npm ci
          npm audit --audit-level=low

  javascript-runtime:
    name: Validate JavaScript runtime
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pytincture/frontend/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: pytincture/frontend
        run: npm ci

      - name: Run JavaScript unit tests
        working-directory: pytincture/frontend
        run: npm test

      - name: Install Chromium
        working-directory: pytincture/frontend
        run: npx playwright install --with-deps chromium

      - name: Run lifecycle browser tests
        working-directory: pytincture/frontend
        run: npm run test:browser

      - name: Build runtime bundles
        working-directory: pytincture/frontend
        run: npm run build

      - name: Verify generated bundles are current
        run: git diff --exit-code -- pytincture/frontend/package.json pytincture/frontend/package-lock.json pytincture/frontend/dist pytincture/frontend/vendor/swagger-ui security/swagger-ui-assets.json

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-lifecycle-report
          path: |
            pytincture/frontend/playwright-report
            pytincture/frontend/test-results
          if-no-files-found: ignore

  browser-e2e:
    name: Pyodide E2E (${{ matrix.browser }})
    needs: python-package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Download validated release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-artifacts
          path: dist

      - name: Install Pytincture and prepare the pinned widget wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[dev]'
          python -m pip download --no-deps --dest tests/e2e_apps dhxpyt==0.9.16
          cp tests/e2e_apps/dhxpyt-0.9.16-py3-none-any.whl tests/e2e_apps/dhxpyt-0.9.16+backend-py3-none-any.whl

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pytincture/frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: pytincture/frontend
        run: npm ci

      - name: Install ${{ matrix.browser }}
        working-directory: pytincture/frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run real Pyodide tests in ${{ matrix.browser }}
        working-directory: pytincture/frontend
        env:
          PYTINCTURE_ACCEPTANCE_RESULT: browser-acceptance-result.json
          PYTINCTURE_E2E_PYTHON: python
        run: npx playwright test --config playwright.e2e.config.mjs --project ${{ matrix.browser }}

      - name: Build authenticated BFF qualification evidence
        if: always()
        run: |
          python scripts/build_qualification_evidence.py \
            --exercise authenticated_bff \
            --status "${{ job.status }}" \
            --artifact-manifest dist/SHA256SUMS.json \
            --result browser=pytincture/frontend/browser-acceptance-result.json \
            --output qualification-evidence-authenticated-bff-${{ matrix.browser }}.json

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytincture-e2e-${{ matrix.browser }}
          path: |
            pytincture/frontend/playwright-report
            pytincture/frontend/test-results
            tests/e2e-server.log
          if-no-files-found: ignore

      - name: Upload E2E performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytincture-performance-${{ matrix.browser }}
          path: |
            qualification-evidence-authenticated-bff-${{ matrix.browser }}.json
            pytincture/frontend/browser-acceptance-result.json
            pytincture/frontend/test-results
          if-no-files-found: warn

  standalone-wheel-e2e:
    name: Standalone Python-wheel acceptance
    needs: python-package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Download validated Python wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-artifacts
          path: dist

      - name: Create wheel-only environment and fallback widget wheel
        shell: bash
        run: |
          python -m venv /tmp/pytincture-standalone-wheel
          standalone_python=/tmp/pytincture-standalone-wheel/bin/python
          "$standalone_python" -m pip install --upgrade pip
          "$standalone_python" -m pip install dist/pytincture-*.whl
          mkdir -p /tmp/pytincture-standalone-widget
          "$standalone_python" -m pip download \
            --no-deps \
            --dest /tmp/pytincture-standalone-widget \
            dhxpyt==0.9.16
          cp \
            /tmp/pytincture-standalone-widget/dhxpyt-0.9.16-py3-none-any.whl \
            /tmp/pytincture-standalone-widget/dhxpyt-0.9.16+backend-py3-none-any.whl

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pytincture/frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: pytincture/frontend
        run: npm ci

      - name: Install Chromium
        working-directory: pytincture/frontend
        run: npx playwright install --with-deps chromium

      - name: Qualify the runtime bundled in the Python wheel
        working-directory: pytincture/frontend
        env:
          PYTINCTURE_ACCEPTANCE_RESULT: standalone-acceptance-result.json
          PYTINCTURE_STANDALONE_PYTHON: /tmp/pytincture-standalone-wheel/bin/python
          PYTINCTURE_STANDALONE_WIDGET_WHEEL: /tmp/pytincture-standalone-widget/dhxpyt-0.9.16+backend-py3-none-any.whl
        run: npx playwright test --config playwright.standalone.config.mjs

      - name: Build standalone qualification evidence
        if: always()
        run: |
          python scripts/build_qualification_evidence.py \
            --exercise standalone \
            --status "${{ job.status }}" \
            --artifact-manifest dist/SHA256SUMS.json \
            --result browser=pytincture/frontend/standalone-acceptance-result.json \
            --output qualification-evidence-standalone.json

      - name: Upload standalone qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytincture-standalone-wheel-acceptance
          path: |
            qualification-evidence-standalone.json
            pytincture/frontend/standalone-acceptance-result.json
            pytincture/frontend/test-results-standalone
            pytincture/frontend/playwright-report
            tests/standalone-server.log
          if-no-files-found: warn

  quickstart-examples-e2e:
    name: Quickstart examples (${{ matrix.browser }})
    needs: python-package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Download validated Python wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-artifacts
          path: dist

      - name: Install the candidate wheel in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/pytincture-quickstart-wheel
          example_python=/tmp/pytincture-quickstart-wheel/bin/python
          "$example_python" -m pip install --upgrade pip
          "$example_python" -m pip install dist/pytincture-*.whl

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pytincture/frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: pytincture/frontend
        run: npm ci

      - name: Install ${{ matrix.browser }}
        working-directory: pytincture/frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run repository quickstarts in ${{ matrix.browser }}
        working-directory: pytincture/frontend
        env:
          PYTINCTURE_EXAMPLE_PYTHON: /tmp/pytincture-quickstart-wheel/bin/python
        run: npm run test:examples -- --project ${{ matrix.browser }}

      - name: Upload quickstart failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytincture-quickstarts-${{ matrix.browser }}
          path: |
            pytincture/frontend/playwright-report
            pytincture/frontend/test-results-examples
            tests/quickstart-service.log
            tests/quickstart-standalone.log
          if-no-files-found: ignore

  saml-federated-e2e:
    name: Keycloak SAML acceptance
    needs: python-package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Download validated Python wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-artifacts
          path: dist

      - name: Create wheel-only SAML environment and fallback widget wheel
        shell: bash
        run: |
          python -m venv /tmp/pytincture-saml-wheel
          saml_python=/tmp/pytincture-saml-wheel/bin/python
          wheel_path=$(find dist -maxdepth 1 -name 'pytincture-*.whl' -print -quit)
          "$saml_python" -m pip install --upgrade pip
          "$saml_python" -m pip install "${wheel_path}[saml]"
          "$saml_python" -m pip download \
            --no-deps \
            --dest tests/e2e_apps \
            dhxpyt==0.9.16
          cp \
            tests/e2e_apps/dhxpyt-0.9.16-py3-none-any.whl \
            tests/e2e_apps/dhxpyt-0.9.16+backend-py3-none-any.whl

      - name: Start pinned Keycloak identity provider
        run: |
          docker run --detach \
            --name pytincture-saml-acceptance \
            --publish 127.0.0.1:8085:8080 \
            --volume "$GITHUB_WORKSPACE/tests/federated/keycloak-realm.json:/opt/keycloak/data/import/pytincture-acceptance-realm.json:ro" \
            --env KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            --env KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.7.2@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067 \
            start-dev --import-realm --hostname=http://127.0.0.1:8085
          for attempt in {1..90}; do
            if curl --fail --silent \
              http://127.0.0.1:8085/realms/pytincture-acceptance/protocol/saml/descriptor \
              > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs pytincture-saml-acceptance
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pytincture/frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: pytincture/frontend
        run: npm ci

      - name: Install Chromium
        working-directory: pytincture/frontend
        run: npx playwright install --with-deps chromium

      - name: Run production-style SAML acceptance
        working-directory: pytincture/frontend
        env:
          PYTINCTURE_ACCEPTANCE_RESULT: saml-acceptance-result.json
          PYTINCTURE_SAML_PYTHON: /tmp/pytincture-saml-wheel/bin/python
        run: npx playwright test --config playwright.saml.config.mjs

      - name: Build federated-auth qualification evidence
        if: always()
        run: |
          python scripts/build_qualification_evidence.py \
            --exercise federated_auth \
            --status "${{ job.status }}" \
            --artifact-manifest dist/SHA256SUMS.json \
            --result saml=pytincture/frontend/saml-acceptance-result.json \
            --result saml_transform_mitigation=security/saml-transform-mitigation.json \
            --result saml_replay_mitigation=security/saml-replay-mitigation.json \
            --result security_review_dispositions=security/review-dispositions.json \
            --output qualification-evidence-federated-auth.json

      - name: Capture Keycloak log
        if: always()
        run: docker logs pytincture-saml-acceptance > tests/keycloak-saml.log 2>&1

      - name: Stop Keycloak
        if: always()
        run: docker stop pytincture-saml-acceptance

      - name: Upload SAML qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytincture-saml-federated-acceptance
          path: |
            qualification-evidence-federated-auth.json
            security/saml-transform-mitigation.json
            security/saml-replay-mitigation.json
            security/review-dispositions.json
            pytincture/frontend/saml-acceptance-result.json
            pytincture/frontend/test-results-saml
            pytincture/frontend/playwright-report
            tests/federated-saml-server.log
            tests/keycloak-saml.log
          if-no-files-found: warn

  production-smoke:
    name: Production topology smoke
    needs: python-package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Download validated release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-artifacts
          path: dist

      - name: Install validated Pytincture wheel in a clean environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/pytincture-*.whl

      - name: Run health load budget
        env:
          MODULES_PATH: tests/e2e_apps
          PYTINCTURE_DEFAULT_APPLICATION: e2e_app
          BFF_MAX_CONCURRENCY: "2"
          BFF_MAX_QUEUE: "20"
          BFF_QUEUE_TIMEOUT_SECONDS: "0.05"
        run: |
          python -m uvicorn pytincture.backend.app:app --host 127.0.0.1 --port 8081 > production-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python scripts/run_performance_smoke.py \
            --base-url http://127.0.0.1:8081

      - name: Build service-performance qualification evidence
        if: always()
        run: |
          python scripts/build_qualification_evidence.py \
            --exercise performance_service \
            --status "${{ job.status }}" \
            --artifact-manifest dist/SHA256SUMS.json \
            --result health=performance-health.json \
            --result appcode=performance-appcode.json \
            --result bff=performance-bff.json \
            --result saturation=performance-saturation.json \
            --output qualification-evidence-performance-service.json

      - name: Upload service performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytincture-performance-service
          path: |
            qualification-evidence-performance-service.json
            performance-*.json
          if-no-files-found: warn

      - name: Upload production smoke log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-smoke-log
          path: production-smoke.log
          if-no-files-found: ignore

  attest-release-artifacts:
    name: Attest validated release artifacts
    if: github.event_name == 'release'
    needs:
      - python-tests
      - python-package
      - optional-extras
      - upgrade-rollback
      - release-gates
      - security-audit
      - javascript-runtime
      - browser-e2e
      - standalone-wheel-e2e
      - quickstart-examples-e2e
      - saml-federated-e2e
      - production-smoke
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-artifacts
          path: dist

      - name: Attest exact release artifact bytes
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.tgz
            dist/SHA256SUMS.json
