version: 2

# One weekly integration PR across Python, browser tooling and CI actions.
# Security updates remain eligible for immediate Dependabot handling.
multi-ecosystem-groups:
  dependency-refresh:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "uv"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependency-refresh"
  - package-ecosystem: "npm"
    directory: "/pytincture/frontend"
    patterns: ["*"]
    multi-ecosystem-group: "dependency-refresh"
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependency-refresh"
